apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ledger-api
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/anjan816/dodo-devsecops-assignment.git
    targetRevision: main
    path: gitops/ledger

  destination:
    server: https://kubernetes.default.svc
    namespace: payments

  syncPolicy:

    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
