apiVersion: v1
kind: ServiceAccount
metadata:
  name: authorized-client
  namespace: payments

---

apiVersion: v1
kind: Pod
metadata:
  name: authorized-client
  namespace: payments
  labels:
    app: authorized-client

spec:

  serviceAccountName: authorized-client

  containers:

    - name: curl
      image: curlimages/curl

      command:
        - sleep
        - "3600"

      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 10001

        capabilities:
          drop:
            - ALL

        seccompProfile:
          type: RuntimeDefault
