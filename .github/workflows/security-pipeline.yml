name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ledger-api
  APP_PATH: ledger-api-assignment/app

jobs:
  security-build:
    name: Security Scan, Build, Sign and Attest
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Secret scanning - HARD BLOCK
      # ---------------------------------------------------------
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 3. Python for Semgrep
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      # ---------------------------------------------------------
      # 4. SAST - HARD BLOCK
      # ---------------------------------------------------------
      - name: Run Semgrep SAST
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config auto \
            --error \
            "${APP_PATH}/"

      # ---------------------------------------------------------
      # 5. Dependency / filesystem CVE scan - HARD BLOCK
      #
      # ignore-unfixed=true:
      # High/Critical CVEs without an available fix are documented
      # separately instead of blocking delivery indefinitely.
      # ---------------------------------------------------------
      - name: Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@master
        id: trivy-fs
        continue-on-error: true

        with:
          scan-type: fs
          scan-ref: ./ledger-api-assignment/app
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # ---------------------------------------------------------
      # Publishing is only required for pushes to main.
      # PRs stop after validation/security gates.
      # ---------------------------------------------------------

      # ---------------------------------------------------------
      # 6. Docker Buildx
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------
      # 7. Authenticate to GHCR
      # ---------------------------------------------------------
      - name: Login to GHCR
        id: GHCR-login
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 8. Build image locally for image scanning
      #
      # Do NOT use :latest.
      # Image is tagged with immutable Git commit SHA.
      # ---------------------------------------------------------
      - name: Build image for security scan
        id: build
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./ledger-api-assignment/app
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ---------------------------------------------------------
      # 9. Container image CVE scan - HARD BLOCK
      # ---------------------------------------------------------
      - name: Trivy image vulnerability scan
        id: trivy-image
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # ---------------------------------------------------------
      # 10. Build and push only after security gates pass
      # ---------------------------------------------------------
      - name: Build and push image to GHCR
        id: build-push
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./ledger-api-assignment/app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ---------------------------------------------------------
      # 11. Install Cosign
      # ---------------------------------------------------------
      - name: Install Cosign
        id: cosign-install
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      # ---------------------------------------------------------
      # 12. Keyless Cosign signing
      #
      # Uses GitHub Actions OIDC because id-token: write is enabled.
      # Sign immutable image digest, NOT tag.
      # ---------------------------------------------------------
      - name: Sign container image with Cosign
        id: cosign-sign
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Signing image:"
          echo "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

          cosign sign --yes \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # ---------------------------------------------------------
      # 13. SLSA-style build provenance / attestation
      # ---------------------------------------------------------
      - name: Generate build provenance
        id: attest-build
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ---------------------------------------------------------
      # 14. Print immutable image reference for deployment/evidence
      # ---------------------------------------------------------
      - name: Show immutable image reference
        id: show-image
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "============================================"
          echo "Secure image successfully published"
          echo "Image tag:"
          echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo ""
          echo "Immutable image:"
          echo "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          echo "============================================"